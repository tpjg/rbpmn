[workspace]
resolver = "3"
members = ["benchmarks", "crates/rbpmn-core", "crates/rbpmn-engine", "crates/rbpmn-model", "crates/rbpmn-server", "crates/rbpmn-ui", "crates/rbpmn-wasm"]
# `benchmarks` is a member (one lockfile, and `just lint` covers it with
# `--workspace`) but deliberately not a *default* member: `cargo test` and
# `cargo build` must never compile criterion or a benchmark harness nobody
# asked to run. Benchmarks are a separate track — see benchmarks/README.md.
default-members = ["crates/rbpmn-core", "crates/rbpmn-engine", "crates/rbpmn-model", "crates/rbpmn-server", "crates/rbpmn-ui", "crates/rbpmn-wasm"]
# feel-parity carries its own lockfile: dsntk pulls ~170 crates and a C
# library, and none of that may reach the workspace. Run: `just feel-parity`.
exclude = ["feel-parity"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
