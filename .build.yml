# sourcehut CI for rbpmn.
#
# One task per command in README.md's "Developing" table, so a red build names
# the discipline it broke rather than "tests failed". Nothing here is a
# convenience wrapper: every task is a command a developer is expected to run
# locally, invoked exactly as they would invoke it.
#
# **Benchmarks are deliberately absent.** They are a separate track that never
# gates on absolute numbers, and a shared CI builder is the worst possible
# machine to measure on — see benchmarks/README.md. Note that `just lint` does
# *compile* the benchmark harness (it uses `--workspace`), so the crate cannot
# rot; it is never run.
image: debian/bookworm
packages:
  - build-essential          # cc, for dsntk's dfp-number-sys (feel-parity)
  - curl
  - git
  - pkg-config               # openssl-sys, below
  - libssl-dev               # dsntk-feel-evaluator pulls reqwest with default
                             # features, so native-tls, so openssl. The engine
                             # itself is rustls-only and needs none of this.
  - postgresql               # bookworm ships 15; see setup_database
  - postgresql-client
  - default-jre-headless     # TLC, for `just tla`
  - python3
  - python3-pip              # playwright, for `just e2e-ui`
sources:
  - git@git.sr.ht:~tpjg/rbpmn
secrets:
  # SSH key for the clone. The repository is private, so without this the
  # build fails at checkout — before any task runs, and with an error about
  # the source rather than about anything in here.
  - d41aec0c-ac90-45ea-af0c-10346977e65a
environment:
  # The engine's integration tests create and drop throwaway `rbpmn_test_*`
  # databases. Their default admin URL is `postgres://$USER@localhost/postgres`
  # and the builder user is `build`, which has no role — so point them at the
  # superuser, which also has the CREATEDB right they need.
  RBPMN_TEST_ADMIN_URL: "postgres://postgres@localhost:5432/postgres"
  CARGO_TERM_COLOR: always
  # The served half of `just e2e-ui` is the only place the editor's own fetch
  # happens, and it caught both a `connect-src 'none'` policy that blocked
  # the editor's own button and a URL that resolved one path segment short.
  # It skips itself when Postgres or the ports are unavailable, which is
  # right locally and wrong here — this makes the skip a failure.
  RBPMN_E2E_REQUIRE_SERVED: "1"
tasks:
  - setup: |
      # Rust from rustup, not from Debian: bookworm ships ~1.63 and this
      # workspace needs 1.91, edition 2024 and let-chains.
      #
      # Deliberately **not pinned** to an exact toolchain (Timo's call). The
      # trade is explicit: tracking stable catches new clippy lints the day
      # they land, at the cost that a stable release can red-build a commit
      # that changed nothing relevant. If that becomes annoying, the fix is a
      # rust-toolchain.toml — which also pins every developer's local build,
      # which is why it is not here.
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --profile minimal --component clippy,rustfmt
      source "$HOME/.cargo/env"

      # Node 22 LTS. `just ui`, `just parity` and the playground all build
      # through it.
      curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
      sudo apt-get install -y nodejs

      # just, pinned — and pinned *older* than the version development runs
      # on, deliberately. It is the compatibility floor: the justfile is the
      # interface every one of these tasks goes through, and a recipe that
      # only parses on the newest release is a recipe that breaks for anyone
      # who installed just from their distribution.
      #
      # This has already earned its keep. `bench-population SCENARIO='...'
      # *ARGS:` parses on 1.43 and is a hard error on 1.36 ("non-default
      # parameter follows default parameter") — and because it is a *parse*
      # error the whole file is unusable, so the failure surfaced at
      # `just ui`, three tasks away from the recipe that caused it. The fix
      # was `*ARGS=''`, which both versions accept.
      #
      # Raise this floor deliberately, not by reflex, and only when a recipe
      # genuinely needs newer syntax.
      JUST_VERSION="1.36.0"
      curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
        | tar xz -C /tmp just
      sudo mv /tmp/just /usr/local/bin/

      # wasm-pack from its prebuilt installer — `cargo install` would compile
      # it from source for several minutes on every build, and there is no
      # cache on this builder.
      curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      rustc --version
      cargo --version
      cargo clippy --version
      node --version
      npm --version
      just --version
      wasm-pack --version
      java -version

  - setup_database: |
      # Trust auth for local connections. The builder is a throwaway VM with
      # no network exposure, and the alternative is threading a password
      # through RBPMN_TEST_ADMIN_URL for no gain.
      #
      # Bookworm ships PostgreSQL 15, while development here runs 18. That
      # difference is deliberate coverage rather than an oversight: the only
      # version-sensitive things in the schema are `xid8` and
      # `pg_snapshot_xmin`, both PostgreSQL 13+, so 15 exercises the floor the
      # engine claims to support. It does mean CI cannot catch an 18-only
      # regression; that is what the local suite is for.
      HBA=$(sudo -u postgres psql -tAc 'show hba_file')
      echo "pg_hba.conf: $HBA"
      sudo tee "$HBA" >/dev/null <<'HBA_EOF'
      local   all   all                  trust
      host    all   all   127.0.0.1/32   trust
      host    all   all   ::1/128        trust
      HBA_EOF
      sudo service postgresql restart

      # Poll rather than sleep: a fixed sleep is either too short on a slow
      # builder or wasted time on a fast one.
      for i in $(seq 30); do
        pg_isready -h localhost -q && break
        sleep 1
      done
      pg_isready -h localhost
      psql "$RBPMN_TEST_ADMIN_URL" -tAc 'select version()'

  - setup_playwright: |
      # Its own task so the ~150 MB chromium download is visible in the build
      # log as itself rather than as part of a test that appears to hang.
      # --break-system-packages: bookworm's python3 is PEP 668 managed, and a
      # venv would not be on PATH for `python3 e2e/ui.py`.
      #
      # Installed with sudo so the CLI lands in /usr/local/bin, visible to
      # both root and the build user — a plain `pip install` would put it in
      # ~/.local/bin, where the `sudo playwright` below could not find it.
      # The browser download stays unprivileged, because e2e/ui.py runs as
      # the build user and looks in that user's ~/.cache/ms-playwright.
      sudo pip install --break-system-packages playwright
      sudo playwright install-deps chromium
      playwright install chromium

  - bootstrap: |
      # `just ui` MUST run before anything that builds rbpmn-ui, which means
      # before `just lint` (it uses --workspace) and before `cargo test`. The
      # two UI documents are compile output and are gitignored like every
      # other artifact here; rbpmn-ui's build.rs fails with a message saying
      # exactly this. It is a task of its own so that failure is unambiguous.
      source "$HOME/.cargo/env"
      cd rbpmn
      just ui

  - lint: |
      # clippy -D warnings across the whole workspace + fmt --check. The
      # workspace flag is what keeps the benchmark harness linted: it is a
      # member but not a *default* member, so `cargo test` never builds it and
      # an unlinted crate would quietly drift.
      source "$HOME/.cargo/env"
      cd rbpmn
      just lint

  - test: |
      # Everything, including the fixture corpus and the engine's integration
      # tests against the real Postgres configured above.
      source "$HOME/.cargo/env"
      cd rbpmn
      cargo test

      # The benchmark harness's own unit tests — seeded variable documents,
      # the regression gate's arithmetic, percentile edges. `cargo test`
      # cannot reach them (not a default member) so this is the only place
      # they ever run automatically.
      cargo test -p rbpmn-bench

      df -h /

  - parity: |
      # The playground-never-lies check: byte-parity of native Rust against
      # WASM over the whole corpus, for both exports, plus the bpmnlint
      # plugin's pipeline test. A surface that reports a verdict must report
      # *the* verdict.
      source "$HOME/.cargo/env"
      cd rbpmn
      just parity

  - ui_test: |
      # The UI's pure modules under node: diagnosis, manifest parsing, model
      # facts, the L3 subtraction. No browser, no build artifacts.
      cd rbpmn
      just ui-test

  - e2e_ui: |
      # Both documents driven in a real browser, from file:// and then against
      # a served stack. The Rust tests pin their structure and escaping; none
      # of that notices a blank canvas, and the CSP is only actually enforced
      # in a browser.
      source "$HOME/.cargo/env"
      cd rbpmn
      just e2e-ui

  - fixtures_di: |
      # Run the DI baker and require that it changed nothing — i.e. every
      # fixture already carries the diagram interchange that makes it render
      # in bpmn-js and any standard modeler. The recipe is idempotent by
      # design, so a diff means a fixture landed without DI.
      cd rbpmn
      just fixtures-di
      # Scoped to the corpus on purpose: the recipe runs `npm install` first,
      # which can rewrite a lockfile, and that must not read as a missing
      # fixture.
      if ! git diff --exit-code -- crates/rbpmn-model/tests/fixtures/; then
        echo
        echo "A fixture is missing its baked-in DI (the diff above is what"
        echo "'just fixtures-di' had to add). Run it locally and commit the result."
        exit 1
      fi

  - tla: |
      # TLA+ model checking of the concurrency protocol. Eleven configs, six
      # of them *expected* to fail against the specific violation they
      # demonstrate — a spec that merely stops parsing must not read as "fails
      # as expected", and the recipe enforces that distinction.
      #
      # The specs are hand-written and will not tell you they drifted, which
      # is exactly why this runs on every commit rather than on demand.
      cd rbpmn
      just tla

  - feel_parity: |
      # The FEEL subset differentialled against dsntk (DMN-TCK-verified) over
      # ~8k expression/document pairs. Last because it is the most expensive
      # thing here: dsntk pulls ~170 crates and a C library into its own
      # lockfile outside the workspace, and there is no build cache on this
      # builder.
      source "$HOME/.cargo/env"
      cd rbpmn
      just feel-parity

      df -h /
