[package]
name = "rbpmn-engine"
description = "The PostgreSQL projection of the rbpmn semantic core: transactional stepping, the Engine API, deployment with bindings manifests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rbpmn-core = { path = "../rbpmn-core" }
rbpmn-model = { path = "../rbpmn-model" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }

[features]
http = ["dep:reqwest"]
test-util = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
axum = "0.8"
rbpmn-engine = { path = ".", features = ["http", "test-util"] }
