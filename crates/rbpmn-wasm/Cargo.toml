[package]
name = "rbpmn-wasm"
description = "WASM bindings for rbpmn-model: the exact deploy-time linter, callable from the playground and the bpmnlint plugin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# rbpmn-core is as WASM-clean as rbpmn-model (rbpmn-model + serde + thiserror,
# nothing else) and carries the compile-against-manifest check the editor
# needs. Keeping it that way is now load-bearing for this crate too — see the
# dsntk note in CLAUDE.md.
rbpmn-core = { path = "../rbpmn-core" }
rbpmn-model = { path = "../rbpmn-model" }
# The DMN validator the editor needs, optional so a build that does not want
# decisions does not carry ~100k lines of dsntk. It reaches wasm32 only
# because two `[patch.crates-io]` lines replace the C decimal and the Java
# bridge's HTTP client — see docs/dmn.md.
rbpmn-dmn = { path = "../rbpmn-dmn", optional = true }
wasm-bindgen = "0.2"
serde_json.workspace = true

[features]
# **On** by default, and *still* asked for explicitly by everything that builds
# this module — `just wasm`, and the parity dump that must match it. The
# redundancy is deliberate: both sides of the parity check name the feature, so
# a build that ever loses it fails per fixture instead of quietly comparing two
# different validators.
#
# Without it, bundled decision artifacts are *refused* rather than ignored, so
# a build that dropped this feature cannot quietly accept a deployment it never
# validated.
default = ["dmn"]
dmn = ["dep:rbpmn-dmn"]
