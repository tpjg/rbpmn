\* The same protocol, for the other arm row. A message boundary arms an
\* rbpmn_subscription row on a token that a scope teardown may reap, and
\* `correlate` claims it the way the scheduler claims a timer: resolve the
\* row WITHOUT a lock, take the instance row, re-check that the ROW survived
\* — never that its TOKEN did. `Timers` is bound to subscription rows here;
\* the module is symbolic over "arm rows" and nothing in it is timer-specific.
\* Expected to hold, for the same reason TimerTeardown.cfg does: teardown
\* withdraws every reaped token's subscriptions with it (withdraw_arms).
CONSTANTS
    Nodes = {n1, n2}
    Tokens = {k1, k2}
    Timers = {s1, s2}
    NoToken = NoToken
    NoTimer = NoTimer
    BuggyTeardown = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ArmedTimersHaveLiveTokens
    NeverFiredADanglingTimer
