\* The shipped order against every per-instance row a step really touches:
\* tokens, work items, timers, subscriptions and scopes. Fewer nodes and one
\* instance, because the question this config asks is about row *arity* within
\* an instance; LockOrder.cfg asks the cross-instance question at two rows.
CONSTANTS
    Nodes = {n1, n2}
    Instances = {i1}
    NoOne = NoOne
    HistoricalTimerOrder = FALSE

CONSTANT RowOrder <- AllRows

SPECIFICATION Spec

INVARIANTS
    TypeOK
    SingleLockOrder
    NoWaitCycle

PROPERTIES
    EventuallyIdle
