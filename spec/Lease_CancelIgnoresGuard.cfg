\* Expects a VIOLATION: completion without the AlreadyClosed check — a
\* `complete_task` that reaches the core for an item the process has already
\* withdrawn (an interrupting boundary fired, the scope was torn down, the
\* instance terminated). The shipped code answers `AlreadyClosed { state:
\* "cancelled" }` before the core is invoked; drop that and a clerk's decision
\* lands on a ticket that was paid while it was open.
\*
\* TLC finds the shortest trace: the item is cancelled while still
\* available, then completed by anyone — Cancel, Complete. With a holder it
\* is one step longer (Acquire, Cancel, Complete) and the same bug: a clerk's
\* decision landing on a ticket that was paid while it was open. Nothing
\* about *who* acted is wrong in either shape — a worker completing the task
\* it was given — so LiveLeaseEndsOnlyByItsHolderOrTheProcess holds; only
\* the action property about what may follow a cancel can see it.
CONSTANTS
    Workers = {w1, w2}
    NoOne = NoOne
    Process = Process
    NoLease = NoLease
    TTL = 2
    Backoff = 1
    Retries = 1
    MaxTime = 4
    MaxLeases = 2
    UncheckedRelease = FALSE
    EpochlessRelease = FALSE
    CompleteIgnoresClosed = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK

PROPERTIES
    LiveLeaseEndsOnlyByItsHolderOrTheProcess
    NoCompletionAfterCancel
