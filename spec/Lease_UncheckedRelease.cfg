\* Expects a VIOLATION: release_task without its `lock_owner = $me` check.
\* Every other route back to the queue already excludes a live holder — a
\* claim needs CLAIMABLE (lapsed), a completion or failure needs guard_lease
\* — so an unchecked release is the one action that could free an item out
\* from under a worker still working on it. This is what the owner check is
\* for, and this config is the proof it is load-bearing rather than habit.
CONSTANTS
    Workers = {w1, w2}
    NoOne = NoOne
    NoLease = NoLease
    TTL = 2
    Backoff = 1
    Retries = 1
    MaxTime = 4
    MaxLeases = 2
    UncheckedRelease = TRUE
    EpochlessRelease = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK

PROPERTIES
    LiveLeaseEndsOnlyByItsHolder
