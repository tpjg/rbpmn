\* Expects a VIOLATION: a repair that lands whenever the instance is frozen,
\* whatever incident it names. TLC finds the resend: a repair of incident 0
\* fails again into incident 1, and the same request, arriving again, lands on
\* incident 1 — an incident nobody looked at.
CONSTANTS
    Workers = {w1, w2}
    NoOne = NoOne
    Process = Process
    NoLease = NoLease
    TTL = 1
    Backoff = 1
    Retries = 1
    MaxTime = 2
    MaxLeases = 2
    UncheckedRelease = FALSE
    EpochlessRelease = FALSE
    CompleteIgnoresClosed = FALSE
    Operators = {o1}
    MaxIncidents = 2
    NoIncident = NoIncident
    UncheckedIncident = TRUE

SPECIFICATION Spec

PROPERTIES
    RepairLandsOnlyOnTheIncidentItNamed
