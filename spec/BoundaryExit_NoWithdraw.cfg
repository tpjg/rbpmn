\* Expects a VIOLATION: completion that leaves the boundary's subscription
\* row behind. The arm outlives the wait it was armed on — the TimerTeardown
\* bug, on the completion path — and a PAID arriving after the contest was
\* decided would interrupt a task that no longer exists. TLC stops at the
\* first violated invariant, the armed row on a completed host, one step in.
CONSTANTS
    Nodes = {n1, n2}
    Recheck = TRUE
    RowSpecificRecheck = TRUE
    OtherRow = TRUE
    WithdrawOnComplete = FALSE
    Interrupting = TRUE
    ReResolve = TRUE
    MaxRows = 1
    MaxLate = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ArmDiesWithTheWait
    ExactlyOneExit
    LateCallsAreTyped
