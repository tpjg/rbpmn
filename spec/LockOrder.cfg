\* The shipped protocol: instance row first, NOWAIT on the timer claim.
CONSTANTS
    Nodes = {n1, n2, n3}
    Instances = {i1, i2}
    NoOne = NoOne
    HistoricalTimerOrder = FALSE

CONSTANT RowOrder <- TwoRows

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NeverHoldsRowsWhileNeedingInstance
    NoWaitCycle

PROPERTIES
    EventuallyIdle
