\* The bug fixed in "Apply the phase-6 review": teardown reaps tokens but
\* leaves their timer rows behind. TLC is EXPECTED to find the dangling fire —
\* this config is the reproduction, kept so the fix cannot silently regress.
CONSTANTS
    Nodes = {n1, n2}
    Tokens = {k1, k2}
    Timers = {tm1, tm2}
    NoToken = NoToken
    NoTimer = NoTimer
    BuggyTeardown = TRUE

SPECIFICATION Spec

\* Only the observable consequence is checked, so TLC runs past the
\* intermediate ArmedTimersHaveLiveTokens violation to the end-to-end
\* failure: a timer fired whose token was already gone, which the core
\* answers with StepError::Invariant.
INVARIANTS
    TypeOK
    NeverFiredADanglingTimer
