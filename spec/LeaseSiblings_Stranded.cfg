\* Expects a VIOLATION, and it is not a bug: it is the price of the
\* instance-wide freeze (docs/design/incident-scope.md, D3). The one-item
\* NeverStranded, asked of both items. The instance freezes — an item failing
\* past its budget, or any of the causes that fail no item at all — and the
\* other item, open and perhaps leased to a worker whose handler is still
\* running, can then be neither claimed nor completed until an operator acts.
\* Lease.tla alone cannot reach that state: a sibling is what it takes.
CONSTANTS
    Workers = {w1, w2}
    NoOne = NoOne
    Process = Process
    NoLease = NoLease
    TTL = 1
    Backoff = 1
    Retries = 1
    MaxTime = 2
    MaxLeases = 2
    UncheckedRelease = FALSE
    EpochlessRelease = FALSE
    CompleteIgnoresClosed = FALSE

SPECIFICATION Spec

INVARIANTS
    SiblingNeverStranded
