\* Two items on one instance (LeaseSiblings.tla). Holds: each item keeps its
\* own safety, a stranded item is always a frozen instance, an active
\* instance strands nobody, and a frozen instance advances nothing. Smaller bounds than Lease.cfg because the state
\* space is a product: contention within one item is Lease.cfg's to check.
\* Retries = 1 with two epochs so both Fail and FailFinally are reachable.
CONSTANTS
    Workers = {w1, w2}
    NoOne = NoOne
    Process = Process
    NoLease = NoLease
    TTL = 1
    Backoff = 1
    Retries = 1
    MaxTime = 2
    MaxLeases = 2
    UncheckedRelease = FALSE
    EpochlessRelease = FALSE
    CompleteIgnoresClosed = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    EachItemSafe
    StrandedOnlyWhileFrozen
    ActiveStrandsNobody

PROPERTIES
    FreezeAdvancesNothing
