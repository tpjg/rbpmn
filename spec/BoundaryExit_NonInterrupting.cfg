\* The shipped protocol on a NON-interrupting boundary: each delivery consumes
\* the row and re-arms the next for the same key, the host stays open. Two
\* nodes deliver at once; a failed re-check resolves once more under the lock,
\* so the second message lands on the re-armed row instead of a 404.
CONSTANTS
    Nodes = {n1, n2}
    Recheck = TRUE
    RowSpecificRecheck = TRUE
    OtherRow = TRUE
    WithdrawOnComplete = TRUE
    Interrupting = FALSE
    ReResolve = TRUE
    MaxRows = 4
    MaxLate = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoFalseNotFound
    ExactlyOneExit
    ArmDiesWithTheWait
    LateCallsAreTyped
