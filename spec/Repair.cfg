\* The shipped repair (Repair.tla): a request lands only on the incident it
\* names, the sibling keeps every lease guarantee across the thaw, a landed
\* repair strands nobody, and an abandon leaves nothing open. One operator is
\* enough for the resend that matters; two incidents are what a Retry that
\* fails again needs.
CONSTANTS
    Workers = {w1, w2}
    NoOne = NoOne
    Process = Process
    NoLease = NoLease
    TTL = 1
    Backoff = 1
    Retries = 1
    MaxTime = 2
    MaxLeases = 2
    UncheckedRelease = FALSE
    EpochlessRelease = FALSE
    CompleteIgnoresClosed = FALSE
    Operators = {o1}
    MaxIncidents = 2
    NoIncident = NoIncident
    UncheckedIncident = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    SiblingSafe
    ActiveStrandsNobody
    AbandonedLeavesNothingOpen

PROPERTIES
    RepairLandsOnlyOnTheIncidentItNamed
    FreezeAdvancesNothing
    SiblingLeaseActions
