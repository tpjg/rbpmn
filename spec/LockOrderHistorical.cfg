\* The rejected sketch: the timer claim takes the timer row first, then blocks
\* on the instance row. TLC is EXPECTED to fail here — that is what makes the
\* ordering rule a counterexample-backed decision rather than an assertion.
\*
\* Only TypeOK is checked, so TLC runs on past the (trivially violated)
\* SingleLockOrder to the genuine deadlock: a state with no successors, where
\* one node holds the instance row waiting for the timer row and another holds
\* the timer row waiting for the instance row.
CONSTANTS
    Nodes = {n1, n2, n3}
    Instances = {i1, i2}
    NoOne = NoOne
    HistoricalTimerOrder = TRUE

CONSTANT RowOrder <- TwoRows

SPECIFICATION Spec

INVARIANTS
    TypeOK
