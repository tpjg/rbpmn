\* Expects a VIOLATION: release_task guarded by owner alone, which is how it
\* first shipped. The trace is the bug exactly as it would happen in
\* production — claim, release, re-claim the same item (FIFO hands back the
\* oldest, which is the one just released), then the first release's retry
\* arrives and frees a live claim.
\*
\* Both the release and the replay are the same worker, so every property
\* about *who* acted still holds here — LiveLeaseEndsOnlyByItsHolderOrTheProcess
\* is checked in this config too and does not fire. Only a property about which
\* lease the request named can see it.
CONSTANTS
    Workers = {w1, w2}
    NoOne = NoOne
    Process = Process
    NoLease = NoLease
    TTL = 2
    Backoff = 1
    Retries = 1
    MaxTime = 4
    MaxLeases = 2
    UncheckedRelease = FALSE
    EpochlessRelease = TRUE
    CompleteIgnoresClosed = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK

PROPERTIES
    LiveLeaseEndsOnlyByItsHolderOrTheProcess
    ReleaseFreesOnlyTheLeaseItNamed
