\* Expects a VIOLATION: fail_task guarded by guard_lease alone, which is how
\* it shipped until a review found it. guard_lease refuses only a FOREIGN
\* live lease, so a fail naming a claim that is already over still lands:
\* on an `available` item (the claim was released, or the first copy of
\* this very request landed and its response was lost), spending budget; or
\* on the same owner's next claim, ending it mid-handler. TLC's shortest
\* trace is claim, release, stale fail.
\*
\* The owner is the actor throughout, so LiveLeaseEndsOnlyByItsHolderOrTheProcess
\* is checked here too and does not fire; only a property about which lease
\* the request named can see it.
CONSTANTS
    Workers = {w1, w2}
    NoOne = NoOne
    Process = Process
    NoLease = NoLease
    TTL = 2
    Backoff = 1
    Retries = 1
    MaxTime = 4
    MaxLeases = 2
    UncheckedRelease = FALSE
    EpochlessRelease = FALSE
    EpochlessFail = TRUE
    CompleteIgnoresClosed = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK

PROPERTIES
    LiveLeaseEndsOnlyByItsHolderOrTheProcess
    FailSpendsOnlyTheLeaseItNamed
    ReleaseFreesOnlyTheLeaseItNamed
