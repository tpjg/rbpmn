\* Expects a VIOLATION: correlate resolving the subscription without a lock
\* and then stepping without re-checking it under the instance lock. The
\* trace is the race: a node picks the boundary's row, a completion commits
\* in the window and withdraws it, the delivery proceeds anyway — the host
\* has completed AND the boundary path is taken. (In the engine the core's
\* UnknownSubscription would turn this into an internal error rather than a
\* second exit; the model credits the re-check alone, on purpose — see the
\* module header.)
CONSTANTS
    Nodes = {n1, n2}
    Recheck = FALSE
    RowSpecificRecheck = TRUE
    OtherRow = TRUE
    WithdrawOnComplete = TRUE
    MaxLate = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ExactlyOneExit
    ArmDiesWithTheWait
    LateCallsAreTyped
