\* The shipped protocol: completion withdraws the arm, delivery re-checks its
\* own row under the instance lock. OtherRow is TRUE so the run shows the
\* row-specific re-check is not satisfied by some other subscription.
CONSTANTS
    Nodes = {n1, n2}
    Recheck = TRUE
    RowSpecificRecheck = TRUE
    OtherRow = TRUE
    WithdrawOnComplete = TRUE
    MaxLate = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ExactlyOneExit
    ArmDiesWithTheWait
    LateCallsAreTyped
