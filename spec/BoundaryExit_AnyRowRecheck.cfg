\* Expects a VIOLATION: a re-check that asks "does this instance have an open
\* subscription?" instead of "is THIS subscription still there?". With a
\* sibling branch's catch armed (OtherRow), the picked boundary row is
\* withdrawn by a completion, the re-check passes on the other row, and the
\* delivery reaches step for a row that is gone — an internal error where
\* the contract says 404. Listed first so the trace names the right thing:
\* the late call was not answered typed.
CONSTANTS
    Nodes = {n1, n2}
    Recheck = TRUE
    RowSpecificRecheck = FALSE
    OtherRow = TRUE
    WithdrawOnComplete = TRUE
    MaxLate = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    LateCallsAreTyped
    ExactlyOneExit
    ArmDiesWithTheWait
