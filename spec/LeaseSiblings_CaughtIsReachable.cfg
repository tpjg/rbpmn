\* Expects a VIOLATION, and it is not a bug: it proves the caught branch of
\* a final failure is reached. `Lease`'s FailCaught closes an item as failed
\* and leaves the instance active — a catch-all taking it — and without a
\* reachable state of that shape, ActiveStrandsNobody in LeaseSiblings.cfg
\* would hold vacuously over exactly the case it exists for.
CONSTANTS
    Workers = {w1, w2}
    NoOne = NoOne
    Process = Process
    NoLease = NoLease
    TTL = 1
    Backoff = 1
    Retries = 1
    MaxTime = 2
    MaxLeases = 2
    UncheckedRelease = FALSE
    EpochlessRelease = FALSE
    CompleteIgnoresClosed = FALSE

SPECIFICATION Spec

INVARIANTS
    NoFailureWasCaught
