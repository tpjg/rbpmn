\* Expects a VIOLATION, and it is not a bug: it shows the caught branch of a
\* final failure is reached. `Lease`'s FailCaught closes an item as failed
\* and leaves the instance active — a catch-all taking it — which is the case
\* ActiveStrandsNobody in LeaseSiblings.cfg speaks of; that invariant itself
\* restates the lease's guards once the instance is active.
CONSTANTS
    Workers = {w1, w2}
    NoOne = NoOne
    Process = Process
    NoLease = NoLease
    TTL = 1
    Backoff = 1
    Retries = 1
    MaxTime = 2
    MaxLeases = 2
    UncheckedRelease = FALSE
    EpochlessRelease = FALSE
    CompleteIgnoresClosed = FALSE

SPECIFICATION Spec

INVARIANTS
    NoFailureWasCaught
