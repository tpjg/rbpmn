\* Expects a VIOLATION, and it is not a bug: a repair lands while the sibling
\* the freeze stranded is open, and the sibling then completes. Without a
\* reachable state of that shape, ActiveStrandsNobody in Repair.cfg would hold
\* vacuously over the case it exists for.
CONSTANTS
    Workers = {w1, w2}
    NoOne = NoOne
    Process = Process
    NoLease = NoLease
    TTL = 1
    Backoff = 1
    Retries = 1
    MaxTime = 2
    MaxLeases = 2
    UncheckedRelease = FALSE
    EpochlessRelease = FALSE
    CompleteIgnoresClosed = FALSE
    Operators = {o1}
    MaxIncidents = 2
    NoIncident = NoIncident
    UncheckedIncident = FALSE

SPECIFICATION Spec

INVARIANTS
    NoStrandedSiblingCompletes
