\* Expects a VIOLATION, and it is not a bug: a repair lands while the sibling
\* the freeze stranded is open, and the sibling then completes — the thaw's
\* case, reached. It is what pins that a repair thaws at all:
\* ActiveStrandsNobody in Repair.cfg restates the lease's guards, and holds
\* while the instance is frozen too.
CONSTANTS
    Workers = {w1, w2}
    NoOne = NoOne
    Process = Process
    NoLease = NoLease
    TTL = 1
    Backoff = 1
    Retries = 1
    MaxTime = 2
    MaxLeases = 2
    UncheckedRelease = FALSE
    EpochlessRelease = FALSE
    CompleteIgnoresClosed = FALSE
    Operators = {o1}
    MaxIncidents = 2
    NoIncident = NoIncident
    UncheckedIncident = FALSE

SPECIFICATION Spec

INVARIANTS
    NoStrandedSiblingCompletes
