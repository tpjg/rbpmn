\* Expects a VIOLATION: the row-specific re-check alone on a non-interrupting
\* boundary — the code before the re-resolve. Two deliveries resolve row 1;
\* the first consumes it and re-arms row 2; the second's re-check fails and
\* it answers NoSubscription while row 2 waits for exactly its message.
\* Serially both would land. Listed first so the trace names it.
CONSTANTS
    Nodes = {n1, n2}
    Recheck = TRUE
    RowSpecificRecheck = TRUE
    OtherRow = TRUE
    WithdrawOnComplete = TRUE
    Interrupting = FALSE
    ReResolve = FALSE
    MaxRows = 4
    MaxLate = 2

SPECIFICATION Spec

INVARIANTS
    NoFalseNotFound
    TypeOK
    ExactlyOneExit
    ArmDiesWithTheWait
    LateCallsAreTyped
