\* Expects a VIOLATION: two workers really can both believe they hold the
\* item after a lease lapses and a peer reacquires. The point is that the
\* protocol stays safe anyway — see Lease.cfg.
CONSTANTS
    Workers = {w1, w2}
    NoOne = NoOne
    Process = Process
    NoLease = NoLease
    TTL = 2
    Backoff = 1
    Retries = 1
    MaxTime = 4
    MaxLeases = 2
    UncheckedRelease = FALSE
    EpochlessRelease = FALSE
    CompleteIgnoresClosed = FALSE

SPECIFICATION Spec

INVARIANTS
    DoubleBeliefIsReachable
